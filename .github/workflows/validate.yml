name: Validate Extension Code

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Validate JSON files (like manifest.json)
        run: |
          find . -name "*.json" -print0 | xargs -0 -n1 jq empty

      - name: Conditionally Lint JS (only if package.json exists)
        run: |
          if [ -f "package.json" ]; then
            npm install eslint
            npx eslint . --ext .js || true
          else
            echo "Skipping ESLint because package.json not found"
          fi
